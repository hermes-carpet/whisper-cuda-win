# PROBE round 2 (diagnostic, dispatch-only): pin the CUDA 13.4 Windows silent recipe.
#
# Round 1 proved: on 13.x the Windows installer's default / -s / -t installs ONLY
# the compiler core (~19 bin files) -- cuBLAS/cuDART/NVRTC are now opt-in
# SUBPACKAGES (docs: "additional parameters install specific subpackages instead
# of all packages": cublas_13.4, cublas_dev_13.4, cudart_13.4, ...). Each leg
# first dumps the installer's -h usage (free exact grammar), then installs with:
#   E: the winget-manifest recipe  -y -gm2 -s -n   (what a full host install uses)
#   F: explicit subpackage names   -s <names> ...
# and dumps a COMPLETE build-surface diagnostic (bin exe list, lib\x64 libs,
# include headers) so the log alone answers "can whisper.cpp build + link here"
# (needs: nvcc, cuobjdump, cublas64_13.dll, cublas.lib, cudart_static.lib, headers).
name: cuda13-probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # U: install with deliberately-wrong flag (-zz) => bootstrapper prints
          #    usage/grammar and exits, leaving no install state. Pure discovery.
          - { variant: 'U-usage',
              url: 'https://developer.download.nvidia.com/compute/cuda/13.4.2/network_installers/cuda_13.4.2_windows_x86_64_network.exe',
              flags: '-zz', subpkg: '' }
          # S: baseline from round 1 (worked: compiler core, exit 0) -- no change
          - { variant: 'S-baseline-s',
              url: 'https://developer.download.nvidia.com/compute/cuda/13.4.2/network_installers/cuda_13.4.2_windows_x86_64_network.exe',
              flags: '-s', subpkg: '' }
          # W: the winget-manifest flags AS A SINGLE, EXACT invocation (fresh
          #    runner, no prior install attempt on the machine)
          - { variant: 'W-winget-flags-single',
              url: 'https://developer.download.nvidia.com/compute/cuda/13.4.2/network_installers/cuda_13.4.2_windows_x86_64_network.exe',
              flags: '-y -gm2 -s -n', subpkg: '' }
          # G: base -s + explicit subpackage names, single invocation
          - { variant: 'G-s-subpkgs',
              url: 'https://developer.download.nvidia.com/compute/cuda/13.4.2/network_installers/cuda_13.4.2_windows_x86_64_network.exe',
              flags: '-s', subpkg: 'cublas_13.4 cublas_dev_13.4 cudart_13.4 nvrtc_13.4 nvjitlink_13.4' }

    name: probe [${{ matrix.variant }}]
    env:
      variant: ${{ matrix.variant }}
      url: ${{ matrix.url }}
      flags: ${{ matrix.flags }}
      subpkg: ${{ matrix.subpkg }}
    steps:
      - name: Dump installer usage, install, and dump full toolkit diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root  = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA'
          $d     = Join-Path $root 'v13.4'
          $exe   = Join-Path $env:TEMP 'cuda-probe.exe'
          $args  = @($env:flags -split ' ')
          if ($env:subpkg) { $args = $args + @($env:subpkg -split ' ') }

          Write-Host "=== VARIANT $env:variant | args: $($args -join ' ') ==="
          Write-Host "    url: $env:url"
          if (Test-Path $exe) { Remove-Item $exe -Force }
          Invoke-WebRequest -Uri $env:url -OutFile $exe -UseBasicParsing
          Write-Host ("downloaded: {0:N1} MB" -f ((Get-Item $exe).Length/1MB))
          Write-Host ("sha256 = {0}" -f (Get-FileHash $exe -Algorithm SHA256).Hash)

          # ONE invocation per machine (round 2 showed the 13.4 bootstrapper
          # fails a second run on the same box). For the -zz usage dump this is
          # the only call; for the others it is the install itself.
          $t0 = Get-Date
          $p  = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
          $secs = ((Get-Date) - $t0).TotalSeconds
          $rc = $p.ExitCode
          Write-Host ("installer exit={0} after {1:N0}s" -f $rc, $secs)

          # capture any usage text the bootstrapper printed to a file (the 13.4
          # bootstrapper logs its banner to %TEMP%\*.*.log / *.txt)
          Write-Host '=== bootstrapper logs in TEMP (newest 8) ==='
          Get-ChildItem $env:TEMP -Include '*.log','*.txt' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 8 |
            ForEach-Object { Write-Host ("  {0}  ({1:N0} b)" -f $_.Name, $_.Length) }
          $usage = Get-ChildItem $env:TEMP -Include '*.log','*.txt' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Where-Object { $_.Name -like '*cuda*' -or $_.Name -like '*NVIDIA*' } |
            Select-Object -First 1
          if ($usage) {
            Write-Host ('=== bootstrapper log head: ' + $usage.Name + ' ===')
            Get-Content $usage.FullName -ErrorAction SilentlyContinue | Where-Object { $_.Trim() } | Select-Object -First 50 | ForEach-Object { Write-Host "  $_" }
          }

          # --- build-surface diagnostic (same as before) -----------------------
          $bin = Join-Path $d 'bin'
          $libx = Join-Path $d 'lib\x64'
          $inc  = Join-Path $d 'include'
          Write-Host '=== v13.4\bin\*.exe ==='
          if (Test-Path $bin) { Get-ChildItem $bin -Filter '*.exe' | ForEach-Object { Write-Host "  $($_.Name)" } }
          else { Write-Host '  (bin dir missing)' }
          Write-Host '=== v13.4\bin nvidia DLLs ==='
          if (Test-Path $bin) {
            $n = 0
            Get-ChildItem $bin -Filter '*.dll' | Where-Object { $_.Name -match 'cublas|cudart|nvrtc|nvjitlink' } |
              ForEach-Object { Write-Host ("  {0,12:N0}  {1}" -f $_.Length, $_.Name); $n++ }
            if (-not $n) { Write-Host '  (none)' }
          }
          Write-Host '=== v13.4\lib\x64 key libs ==='
          if (Test-Path $libx) {
            Get-ChildItem $libx | Where-Object { $_.Name -match 'cublas|cudart|nvrtc|nvjitlink' } |
              ForEach-Object { Write-Host ("  {0,12:N0}  {1}" -f $_.Length, $_.Name) }
          } else { Write-Host '  (no lib\x64)' }

          $nvcc = Test-Path (Join-Path $bin 'nvcc.exe')
          $cuobj = Test-Path (Join-Path $bin 'cuobjdump.exe')
          $cubDll = Test-Path (Join-Path $bin 'cublas64_13.dll')
          $cubLib = Test-Path (Join-Path $libx 'cublas.lib')
          $staticRt = Test-Path (Join-Path $libx 'cudart_static.lib')
          $hdr = Test-Path (Join-Path $inc 'cublas_api.h')
          Write-Host ("VERDICT variant={0}: nvcc={1} cuobjdump={2} cublas_dl={3} cublas_lib={4} cudart_static={5} cublas_hdr={6}" -f $env:variant, $nvcc, $cuobj, $cubDll, $cubLib, $staticRt, $hdr)

          # usage variant (U) never expects an install -- informational only
          if ($env:variant -eq 'U-usage') {
            Write-Host '=== U-usage: informational run (no install expected) ==='
            exit 0
          }
          if ($nvcc -and $cuobj -and $cubDll -and $cubLib -and $staticRt -and $hdr) {
            Write-Host "=== VARIANT $env:variant  FULL BUILD SURFACE PRESENT ==="
          } else {
            throw "variant $env:variant build surface incomplete (exit=$rc)"
          }
