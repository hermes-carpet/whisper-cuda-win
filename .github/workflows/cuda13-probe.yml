# PROBE: does CUDA 13.3.1 install via Jimver/cuda-toolkit (method: network)
# give a complete build surface for whisper.cpp -- and critically, does the
# cuBLAS RUNTIME dll land in bin\ (which is what auto-rebuild.yml's
# Get-ToolkitDir gate requires)?
#
# Background (why 13.3 and why this probe):
#   * 13.4's silent install left the full BUILD surface (nvcc, cuobjdump,
#     cublas.lib, cudart_static.lib, cublas_api.h) in place, but NOT
#     cublas64_13.dll in bin\ -- the cuBLAS runtime moved to a separate
#     sub-package. That made the auto-rebuild Get-ToolkitDir gate fail (it
#     requires bin\cublas64_13.dll), so the build step was skipped and the
#     run failed before compiling.
#   * 13.3.1 goes through the SAME Jimver/cuda-toolkit action the 12.9 leg
#     uses (no winget Appx bootstrap, no manual download). This probe runs
#     that exact route so the result transfers directly.
#
# Single leg (fresh runner): Jimver 13.3.1 method:network, then:
#   - dump v13.3 build surface (bin exe list, bin runtime DLLs, lib\x64 libs,
#     include headers)
#   - LOCATE cublas64_13.dll / cublasLt64_13.dll / cudart64_13.dll ANYWHERE
#     under the CUDA root (so if it's not in bin\ we know the real path)
#   - emit a VERDICT133 line
#
# The install step is the shipped route (Jimver action) and this step only
# reads the filesystem, so the run is informational (exits 0 either way) and
# the log alone answers "can whisper.cpp compile AND link against cuBLAS here".
name: cuda13-probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Install CUDA 13.3.1 via Jimver (the route auto-rebuild would ship)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'
          method: 'network'

      - name: Dump v13.3 build surface + locate cuBLAS runtime DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA'
          Write-Host "CUDA root: $root exists=$(Test-Path $root)"
          if (-not (Test-Path $root)) { throw "CUDA root missing after Jimver install" }

          # Installed version dir: Jimver for 13.3.1 installs under v13.3
          $d    = Join-Path $root 'v13.3'
          Write-Host "expected version dir: $d  exists=$(Test-Path $d)"
          if (-not (Test-Path $d)) {
            # fall back: list whatever version dirs exist and pick the 13.x one
            $found = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -match '^v13\.' } | Select-Object -First 1
            if ($found) { $d = $found.FullName; Write-Host "  using found dir: $d" }
          }

          $bin  = Join-Path $d 'bin'
          $libx = Join-Path $d 'lib\x64'
          $inc  = Join-Path $d 'include'

          Write-Host "=== $d\bin\*.exe ==="
          if (Test-Path $bin) { Get-ChildItem $bin -Filter '*.exe' | ForEach-Object { Write-Host ("  {0}" -f $_.Name) } }
          else { Write-Host "  (bin dir missing)" }

          Write-Host "=== $d\bin runtime DLLs (cublas|cudart|nvrtc|nvjitlink) ==="
          if (Test-Path $bin) {
            $n = 0
            Get-ChildItem $bin -Filter '*.dll' | Where-Object { $_.Name -match 'cublas|cudart|nvrtc|nvjitlink' } |
              ForEach-Object { Write-Host ("  {0,12:N0}  {1}" -f $_.Length, $_.Name); $n++ }
            if (-not $n) { Write-Host "  (none in bin)" }
          }

          Write-Host "=== ALL bin\*.dll names (so we can see whether any runtime landed in bin) ==="
          if (Test-Path $bin) {
            (Get-ChildItem $bin -Filter '*.dll' | ForEach-Object { $_.Name }) -join '  ' | ForEach-Object { Write-Host "  $_" }
          }

          Write-Host "=== $d\lib\x64 key libs (cublas|cudart|nvrtc|nvjitlink) ==="
          if (Test-Path $libx) {
            Get-ChildItem $libx | Where-Object { $_.Name -match 'cublas|cudart|nvrtc|nvjitlink' } |
              ForEach-Object { Write-Host ("  {0,12:N0}  {1}" -f $_.Length, $_.Name) }
          } else { Write-Host "  (no lib\x64)" }

          Write-Host "=== $d\include cuBLAS/cuDART headers present? ==="
          if (Test-Path $inc) {
            foreach ($h in @('cublas_api.h','cublas_v2.h','cublasLt.h','cuda_runtime.h','driver_types.h')) {
              Write-Host ("  {0,-20} {1}" -f $h, (Test-Path (Join-Path $inc $h)))
            }
          } else { Write-Host "  (no include dir)" }

          # --- the decisive bit: WHERE is the cuBLAS runtime actually? ----
          Write-Host "=== LOCATE cuBLAS/cuDART runtime DLLs ANYWHERE under $root ==="
          foreach ($name in @('cublas64_13.dll','cublasLt64_13.dll','cudart64_13.dll','nvrtc64_130_3.dll')) {
            $hits = Get-ChildItem $root -Recurse -Filter $name -File -ErrorAction SilentlyContinue
            if ($hits) {
              $hits | ForEach-Object { Write-Host ("  FOUND {0,12:N0}  {1}" -f $_.Length, $_.FullName) }
            } else {
              Write-Host ("  (not found anywhere)  {0}" -f $name)
            }
          }

          # --- verdict -----------------------------------------------------
          $nvcc     = Test-Path (Join-Path $bin 'nvcc.exe')
          $cuobj    = Test-Path (Join-Path $bin 'cuobjdump.exe')
          $cubDll   = Test-Path (Join-Path $bin 'cublas64_13.dll')
          $cubLib   = Test-Path (Join-Path $libx 'cublas.lib')
          $staticRt = Test-Path (Join-Path $libx 'cudart_static.lib')
          $hdr      = Test-Path (Join-Path $inc 'cublas_api.h')
          Write-Host ("VERDICT133: nvcc={0} cuobjdump={1} cublas_dl_IN_BIN={2} cublas_lib={3} cudart_static={4} cublas_hdr={5}" -f $nvcc, $cuobj, $cubDll, $cubLib, $staticRt, $hdr)
          if ($nvcc -and $cubLib -and $staticRt -and $hdr) {
            if ($cubDll) { Write-Host "=== 13.3.1 via Jimver: FULL build surface INCLUDING runtime dll in bin -- SHIP IT ===" }
            else { Write-Host "=== 13.3.1 build surface OK but runtime dll NOT in bin -- see LOCATE section for real path ===" }
          } else {
            Write-Host "=== 13.3.1 build surface INCOMPLETE -- inspect sections above ==="
          }
          # informational: always exit 0, we read the log either way
          exit 0
