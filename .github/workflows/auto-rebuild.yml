# Auto-build whisper.cpp (whisper-cli) as a Windows CUDA 12.9 / Turing (sm_75)
# package whenever upstream ggml-org/whisper.cpp (master) moves -- and only
# publish a GitHub Release if the build passes BOTH:
#   1. executable smoke test: a CPU-only build of the same commit transcribes
#      samples/jfk.wav correctly (proves sources + toolchain are coherent);
#   2. structural verification of the CUDA build: complete artifacts, static
#      cudart (no cudart64_12.dll import), cuBLAS DLL, driver import, sm_75 SASS.
#
# The CUDA binary itself CANNOT be executed on a hosted runner: ggml-cuda.dll
# imports nvcuda.dll (the NVIDIA driver, which only the target machine has), so
# launching it there would die with 0xC0000135 (STATUS_DLL_NOT_FOUND) at load.
#
# Published (only on pass):
#   GitHub Release tag `whisper-<version>` (e.g. whisper-1.9.4, or
#   whisper-1.9.4-dev when the commit is between upstream tags; the version
#   is parsed from upstream CMakeLists.txt and the full SHA is recorded in
#   the release notes):
#     whisper-cli-<version>-win-cuda12.9.zip         (slim: system CUDA 12.9 cuBLAS)
#     whisper-cli-<version>-win-cuda12.9-cublas.zip  (portable: bundles cuBLAS)
#
# State: `upstream-sha` in the repo root = last published upstream SHA.
#
# This mirrors hermes-carpet/llama-slim: a weekly cron (Tue 09:00 UTC) polls
# ggml-org/whisper.cpp master and a successful poll self-commits the new
# upstream SHA back to this repo (keepalive / no GitHub inactivity timeout).
# A failed build/test publishes nothing and leaves the last passing release.

name: auto-rebuild-on-upstream

on:
  schedule:
    # Weekly, Tuesday 09:00 UTC: poll ggml-org/whisper.cpp master for
    # commits newer than upstream-sha; if none, exits fast with no build.
    # Matches hermes-carpet/llama-slim cadence (0 9 * * 2).
    - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Explicit upstream commit to build (default: latest master)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if SHA already published'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: auto-rebuild-whisper-cuda
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-24.04
    outputs:
      build_sha: ${{ steps.check.outputs.build_sha }}
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      version_label: ${{ steps.version.outputs.version_label }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve latest upstream master SHA
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(curl -fsSL \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "User-Agent: hermes-carpet-whisper-cuda-ci" \
                  https://api.github.com/repos/ggml-org/whisper.cpp/commits/master \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream master: $sha"

      - name: Compare with published SHA
        id: check
        run: |
          set -euo pipefail
          latest="${{ steps.latest.outputs.sha }}"
          explicit="${{ inputs.upstream_sha }}"
          force="${{ inputs.force }}"
          if [ -n "$explicit" ]; then latest="$explicit"; fi
          current=$(cat upstream-sha 2>/dev/null || echo "")
          echo "published_sha=${current:-<none>}"
          echo "candidate_sha=$latest"
          if [ "$latest" = "$current" ] && [ "$force" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "build_sha=" >> "$GITHUB_OUTPUT"
            echo "Already published, nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "build_sha=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve upstream version (human-readable) for release naming
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # whisper.cpp keeps its SemVer in CMakeLists.txt as three variables
          # (WHISPER_VERSION_MAJOR / MINOR / PATCH). A git tag (vX.Y.Z) is NOT a
          # separate version file, so parse the CMake values at the target SHA.
          # The label used everywhere downstream (tag, title, asset filenames):
          #   "<X.Y.Z>"       when the commit is exactly the upstream vX.Y.Z tag
          #   "<X.Y.Z>-dev"   when it is a master commit between tags
          #   "<sha12>"       fallback if the version cannot be resolved
          sha="${{ steps.check.outputs.build_sha }}"
          v=""
          if [ -n "$sha" ]; then
            cm=$(curl -fsSL \
                  -H "Authorization: Bearer ***" \
                  "https://raw.githubusercontent.com/ggml-org/whisper.cpp/${sha}/CMakeLists.txt" || echo "")
            maj=$(printf '%s\n' "$cm" | sed -nE 's/^set\(WHISPER_VERSION_MAJOR ([0-9]+).*/\1/p' | head -1)
            min=$(printf '%s\n' "$cm" | sed -nE 's/^set\(WHISPER_VERSION_MINOR ([0-9]+).*/\1/p' | head -1)
            pat=$(printf '%s\n' "$cm" | sed -nE 's/^set\(WHISPER_VERSION_PATCH ([0-9]+).*/\1/p' | head -1)
            if [ -n "${maj}${min}${pat}" ]; then
              v="${maj}.${min}.${pat}"
            fi
          fi

          label=""
          if [ -n "$v" ]; then
            # Does this sha match an upstream git tag (v<version>)?
            # /git/refs/tags/{tag} returns the object the tag points at --
            # an annotated tag object (type=tag, needs deref) or, for a
            # lightweight tag, the commit object itself (type=commit).
            commit_of_tag=""
            vref=$(gh api "repos/ggml-org/whisper.cpp/git/refs/tags/v${v}" 2>/dev/null || echo "")
            if [ -n "${vref}" ]; then
              obj_type=$(printf '%s' "${vref}" | jq -r '.object.type' 2>/dev/null || echo "")
              obj_sha=$(printf '%s' "${vref}" | jq -r '.object.sha' 2>/dev/null || echo "")
              if [ "${obj_type}" = "tag" ]; then
                commit_of_tag=$(gh api "repos/ggml-org/whisper.cpp/git/tags/${obj_sha}" --jq '.object.sha' 2>/dev/null || echo "")
              else
                commit_of_tag="${obj_sha}"
              fi
            fi
            if [ -n "$sha" ] && [ "${commit_of_tag:-}" = "${sha}" ]; then
              label="${v}"
            else
              label="${v}-dev"
            fi
          fi
          if [ -z "$label" ]; then
            label="${sha:0:12}"
            echo "WARN: upstream version unresolved; using bare sha for naming"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "version_label=${label}" >> "$GITHUB_OUTPUT"
          echo "Resolved label: ${label} (version=${v:-<none>}, sha=${sha:0:12})"

  build-windows:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    # PINNED: windows-latest rotated to the "windows-2025-vs2026" image (VS 2026
    # only, no VS 2022) on 2026-09-25. nvcc 12.9 only supports VS 2017..2022,
    # so the build must run on an image that still ships VS 2022.
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      UPSTREAM_SHA: ${{ needs.check-upstream.outputs.build_sha }}
      UPSTREAM_VERSION_LABEL: ${{ needs.check-upstream.outputs.version_label }}
      CUDA_VER: '12.9.0'
    steps:
      - uses: actions/checkout@v6

      - name: Fetch upstream whisper.cpp at candidate SHA (ggml vendored, no submodules)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path upstream | Out-Null
          Push-Location upstream
          git init -q
          git remote add origin https://github.com/ggml-org/whisper.cpp
          git fetch -q --depth 1 origin $env:UPSTREAM_SHA
          git checkout -q FETCH_HEAD
          Write-Host "checked out $(git rev-parse HEAD)"
          # ggml is vendored as a plain directory (no .gitmodules) -- nothing to recurse.
          Pop-Location

      - name: Install CUDA Toolkit 12.9.0
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda
        with:
          cuda: ${{ env.CUDA_VER }}
          method: 'network'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Build CUDA whisper-cli (sm_75 / Turing, CUDA 12.9)
        shell: cmd
        run: |
          scripts\build-whisper-cuda.cmd CUDA > build-cuda.log 2>&1
          if errorlevel 1 (
            echo "=== CUDA build FAILED: last 60 lines of build-cuda.log ==="
            powershell -NoProfile -Command "Get-Content build-cuda.log -Tail 60"
            exit /b 1
          )
          echo "=== CUDA build OK: last 30 lines of build-cuda.log ==="
          powershell -NoProfile -Command "Get-Content build-cuda.log -Tail 30"

      - name: Verify CUDA build (structural - no GPU on this runner)
        shell: pwsh
        run: |
          # The CUDA binary cannot be executed here (no NVIDIA driver => 0xC0000135).
          # Verify the artifacts instead: completeness, static cudart, DLL cuBLAS,
          # driver import present, sm_75 SASS embedded, single-arch size.
          $env:PATH = "$env:CUDA_PATH\bin;" + $env:PATH
          . "$PWD\scripts\verify-cuda.ps1"

      - name: Build CPU whisper-cli (no CUDA - for the executable smoke test)
        shell: cmd
        run: |
          scripts\build-whisper-cuda.cmd CPU > build-cpu.log 2>&1
          if errorlevel 1 (
            echo "=== CPU build FAILED: last 60 lines of build-cpu.log ==="
            powershell -NoProfile -Command "Get-Content build-cpu.log -Tail 60"
            exit /b 1
          )
          echo "=== CPU build OK: last 20 lines of build-cpu.log ==="
          powershell -NoProfile -Command "Get-Content build-cpu.log -Tail 20"

      - name: CPU smoke test (transcribe jfk.wav with the CPU build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = "$PWD\build-cpu\bin\whisper-cli.exe"
          if (-not (Test-Path $exe)) { throw "CPU whisper-cli.exe missing at $exe" }

          $wav = "$PWD\upstream\samples\jfk.wav"
          if (-not (Test-Path $wav)) { throw "jfk.wav not found at $wav" }

          New-Item -ItemType Directory -Force -Path model | Out-Null
          $model = "$PWD\model\ggml-tiny.en.bin"
          if (-not (Test-Path $model)) {
            Write-Host "Downloading ggml-tiny.en.bin..."
            Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -OutFile $model -UseBasicParsing
          }
          Write-Host ("model size: {0:N0} bytes" -f (Get-Item $model).Length)

          Write-Host "Running: $exe -m $model -f $wav -l en -nt"
          & $exe -m $model -f $wav -l en -nt > transcribe.log 2>&1
          $code = $LASTEXITCODE
          Write-Host "---- transcribe.log ----"
          Get-Content transcribe.log
          if ($code -ne 0) { throw "whisper-cli exited $code on CPU smoke test (see transcribe.log)" }
          $txt = Get-Content transcribe.log -Raw
          if ($txt -notmatch 'that is|country|american|fellow|ask not|your|that no') {
            Write-Host "WARN: transcript did not match expected JFK keywords: $txt"
          }
          Write-Host "CPU smoke test PASSED"

      - name: Package slim (system cuBLAS) + portable (bundled cuBLAS)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $label = $env:UPSTREAM_VERSION_LABEL
          if (-not $label) { $label = ($env:UPSTREAM_SHA).Substring(0,12) }
          New-Item -ItemType Directory -Force -Path dist\slim | Out-Null

          # Copy the built exe + every DLL the build produced in bin\. With --target
          # whisper-cli the set is exactly { whisper-cli.exe whisper.dll ggml.dll
          # ggml-base.dll ggml-cpu.dll ggml-cuda.dll } -- nothing else is built.
          Copy-Item "$PWD\build\bin\whisper-cli.exe" dist\slim\
          Get-ChildItem "$PWD\build\bin" -Filter '*.dll' | ForEach-Object {
            Copy-Item $_.FullName dist\slim\
          }
          Write-Host "Slim payload:"
          Get-ChildItem dist\slim | ForEach-Object { Write-Host ("  {0,12:N0}  {1}" -f $_.Length, $_.Name) }

          # Launcher resolves CUDA 12.9 via CUDA_PATH_V12_9 (toolkit-set) over a polluted
          # PATH, so cuBLAS/cuDART load from the 12.9 install on the target machine.
          [IO.File]::WriteAllLines("$PWD\dist\slim\whisper.bat", @(
            '@echo off',
            'rem whisper-cuda launcher: prefer CUDA 12.9 via CUDA_PATH_V12_9 (toolkit-set)',
            'rem so cuBLAS/cuDART resolve from the 12.9 install, not from a polluted PATH.',
            'if "%CUDA_PATH_V12_9%"=="" (',
            '  echo [whisper-cuda] WARNING: CUDA_PATH_V12_9 is not set on this machine.',
            '  echo [whisper-cuda]   cuBLAS/cuDART must come from the CUDA 12.9 toolkit.',
            '  echo [whisper-cuda]   Fix: set CUDA_PATH_V12_9 to your CUDA 12.9 install dir,',
            '  echo [whisper-cuda]   e.g. C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9',
            '  echo [whisper-cuda]   (the CUDA 12.9 toolkit normally sets this) and re-run.',
            ') else (',
            '  set "PATH=%CUDA_PATH_V12_9%\bin;%PATH%"',
            ')',
            '"%~dp0whisper-cli.exe" %*'
          ), [Text.Encoding]::ASCII)

          # Slim zip: exe + ggml/whisper DLLs + launcher. cuBLAS comes from system CUDA 12.9.
          Compress-Archive -Path dist\slim\* -DestinationPath "whisper-cli-$label-win-cuda12.9.zip" -Force

          # Portable zip: same, but bundle cuBLAS from the toolkit's bin for CUDA-less machines.
          New-Item -ItemType Directory -Force -Path dist\full | Out-Null
          Copy-Item dist\slim\* dist\full\ -Force
          Get-ChildItem "$env:CUDA_PATH\bin" -Filter 'cublas*.dll' | ForEach-Object {
            Copy-Item $_.FullName dist\full\ -Force
          }
          Compress-Archive -Path dist\full\* -DestinationPath "whisper-cli-$label-win-cuda12.9-cublas.zip" -Force

          Write-Host "=== release zips (label=$label) ==="
          Get-ChildItem "$PWD" -Filter 'whisper-cli-*.zip' | ForEach-Object {
            Write-Host ("  {0,10:N0} KB  {1}" -f ($_.Length/1024), $_.Name)
          }

      - name: Upload build logs + artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cuda-win-${{ env.UPSTREAM_SHA }}
          path: |
            whisper-cli-*.zip
            build-cuda.log
            build-cpu.log
            transcribe.log
            sass-targets.txt
          retention-days: 14
          if-no-files-found: warn

  release:
    needs: [check-upstream, build-windows]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # needed by `gh release create`
    steps:
      - uses: actions/checkout@v6
        with:
          # fetch this repo's git objects so gh release create can resolve
          # the target SHA / create+push the tag (it shells out to git).
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: whisper-cuda-win-${{ needs.check-upstream.outputs.build_sha }}
          path: artifacts

      - name: Create GitHub Release (only on pass)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ needs.check-upstream.outputs.build_sha }}
          VERSION_LABEL: ${{ needs.check-upstream.outputs.version_label }}
        run: |
          set -euo pipefail
          sha="${{ needs.check-upstream.outputs.build_sha }}"

          # version_label is computed once in check-upstream (resolves the
          # upstream CMakeLists version and the exact-tag vs -dev state) and
          # is also used by build-windows to name the zips, so this step just
          # consumes it. Fallback to the 12-char sha if it ever came through
          # empty (e.g. version unresolvable).
          label="${VERSION_LABEL}"
          [ -n "${label}" ] || label="${sha:0:12}"

          tag="whisper-${label}"
          # idempotent: a prior run (force) may have already created this tag
          gh api -X DELETE "repos/${{ github.repository }}/releases/tags/${tag}" >/dev/null 2>&1 || true

          # --- Write the release notes --------------------------------------
          # Version/SHA are embedded as markdown inline code. In bash double-
          # quotes, backtick escapes (\`) are literal and ${var} expands --
          # exactly what we want (opposite of a single-quoted heredoc where
          # ${var} stays literal, which was the old bug at line 353).
          TOP_LINE="whisper-cli \`${label}\` from \`ggml-org/whisper.cpp\` -- Windows 10 / CUDA 12.9 / Turing sm_75."
          SHA_LINE="Upstream commit: \`${sha}\`."
          {
            printf '%s\n' "$TOP_LINE"
            printf '\n'
            printf '%s\n' "$SHA_LINE"
            printf '\n'
            cat <<'BODY'
          ## Windows host requirements
          - NVIDIA GPU driver installed (provides `nvcuda.dll`).
          - cuBLAS 12.x resolvable. Two zips:
            - **slim** -- relies on your system CUDA 12.9 toolkit. `whisper.bat`
              puts `%CUDA_PATH_V12_9%\bin` first on PATH so cuBLAS loads from the
              12.9 install, not a polluted PATH. If `CUDA_PATH_V12_9` is unset the
              wrapper prints exactly what to set and exits.
            - **cublas** -- bundles `cublas*.dll` from the toolkit for machines without CUDA.

          ## Files
          - `whisper-cli.exe` -- the CLI
          - `ggml-cuda.dll` (~50-60 MB after the sm_75 single-arch cut)
          - `ggml.dll`, `ggml-base.dll`, `ggml-cpu.dll`, `whisper.dll`
          - `whisper.bat` -- launcher that resolves CUDA 12.9 via `CUDA_PATH_V12_9`

          ## Build notes
          - CUDA 12.9 (Jimver/cuda-toolkit), `-DCMAKE_CUDA_ARCHITECTURES=75` (RTX 2060/2070/2080/Titan Xp).
          - `GGML_STATIC=ON` => cudart statically linked (no `cudart64_12.dll` needed) -- verified in CI.
          - cuBLAS stays a DLL -- NVIDIA ships no static `cublas.lib` for Windows (upstream
            `ggml/src/ggml-cuda/CMakeLists.txt`: "CUDA Toolkit for Windows does not offer a static
            cublas library"), so `ggml-cuda.dll` links static cudart + dynamic cuBLAS.
          - Kernels are nvcc-compiled to sm_75 SASS at build time (no NVRTC, no runtime
            JIT): cold start is instant; the binary is tied to the CUDA 12.9 build.
          - Tests, server, SDL2, cURL, OpenMP and native-CPU autotuning are off; only
            `whisper-cli` is compiled (`--target`), so no other example executable builds.
            The CPU backend is a single baseline variant (GGML_NATIVE=OFF, not the
            multi-variant matrix).

          ## CI verification (GPU-less runner)
          - The CUDA binary cannot be *executed* on a hosted runner (it imports
            `nvcuda.dll`, the driver, which runners do not have -- would die with
            0xC0000135 at load). Instead CI:
            1. builds a CPU-only binary of the same commit and runs a real
               transcription of `samples/jfk.wav` (tiny.en) -- must exit 0 and
               contain the expected JFK keywords;
            2. structurally verifies the CUDA artifacts: no `cudart64_12.dll`
               import (cudart static), `cublas64_12.dll` + `nvcuda` imports
               present, `ggml-cuda.dll` single-arch sized (~50-60 MB), sm_75
               SASS embedded (verified via cuobjdump).

          ## Usage
          ```bat
          whisper.bat -m yourmodel.bin -f audio.wav -l en
          ```
          BODY
          } > release-body.md

          # Create the release via REST (no local git / tag-pushing; the runner
          # isn't a checkout target for that). target_commitish is omitted on
          # purpose: build_sha is the *upstream whisper.cpp* commit, which does
          # not exist in THIS repo. Default = default branch HEAD.
          release_id=$(GH_TOKEN="$GH_TOKEN" gh api \
            -X POST "repos/${{ github.repository }}/releases" \
            -f "tag_name=${tag}" \
            -f "name=whisper-cli ${label}" \
            -F "body=@release-body.md" \
            --jq '.id')

          GH_TOKEN="$GH_TOKEN" gh release upload "${tag}" \
            "artifacts/whisper-cli-${label}-win-cuda12.9.zip" \
            "artifacts/whisper-cli-${label}-win-cuda12.9-cublas.zip" --clobber

  commit-sha:
    # Self-commit the newly published upstream SHA back to this repo. This push is the
    # llama-slim keepalive pattern -- it keeps the pipeline fresh and re-triggers cleanly.
    needs: [check-upstream, release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Commit + push new published SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ needs.check-upstream.outputs.build_sha }}"
          if [ "$(cat upstream-sha 2>/dev/null)" = "$sha" ]; then
            echo "upstream-sha already $sha -- force-rebuild; nothing to self-commit."
            exit 0
          fi
          echo "${sha}" > upstream-sha
          git config user.name  "hermes-carpet"
          git config user.email "hermes-carpet@users.noreply.github.com"
          git add upstream-sha
          git commit -m "auto-rebuild: publish whisper-cuda build for upstream ${sha}"
          git push
          echo "pushed new upstream-sha: ${sha}"
