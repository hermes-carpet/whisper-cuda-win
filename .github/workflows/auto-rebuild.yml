# Auto-build whisper.cpp (whisper-cli) for a set of GPU/CUDA configs on Windows,
# and publish ONE GitHub Release (tagged by the upstream version label) containing
# one pair of zips per config. Rebuild is gated on the upstream VERSION NUMBER
# (WHISPER_VERSION_MAJOR.MINOR.PATCH from whisper.cpp's CMakeLists.txt) -- it ONLY
# fires when that number changes, not on every master commit.
#
# A "config" = one row of the build-windows matrix. To support a new GPU/CUDA combo,
# add one row there -- everything (naming, launcher env var, zip suffix, artifact
# name, release file listing) is derived from that row, so a new future config is a
# one-line addition. The two configs today:
#
#   turing-cuda12.9 : RTX 2060/2070/2080 / Titan Xp (Turing sm_75), CUDA 12.9
#   ada-cuda13.3    : RTX 4060 (Ada sm_89), host CUDA 13.3
#
# CUDA binary CANNOT be executed on a hosted runner: ggml-cuda.dll imports
# nvcuda.dll (the NVIDIA driver, only on the target machine) -> 0xC0000135 at load.
# So each CUDA build is verified STRUCTURALLY (complete artifacts, static cudart,
# cuBLAS DLL import, driver import, single-arch SASS via cuobjdump), while a separate
# CPU-only build of the same commit runs a real jfk.wav transcription as the
# executable smoke test (run once, config-independent).
#
# Per-config published zips (only on pass):
#   whisper-cli-<label>-win-cuda<HOST_CUDA>.zip          (slim: system cuBLAS)
#   whisper-cli-<label>-win-cuda<HOST_CUDA>-cublas.zip   (portable: bundles cuBLAS)
# where <label> is the upstream version label (e.g. 1.9.4 or 1.9.4-dev) and the
# release tag is whisper-<label>.
#
# Note on the 4060 CUDA: it targets host CUDA 13.3 (whisper.bat resolves
# %CUDA_PATH_V13_3%). CI builds it against CUDA 13.3.1 via Jimver/cuda-toolkit
# (method: network) -- the SAME route-and-source as the 12.9 lane: no winget
# Appx bootstrap, no manual installer download, no hardcoded NVIDIA URL (Jimver
# resolves the patch from its own CDN map). A 13.3-built binary links
# cublas64_13.dll and runs on any CUDA 13.x host; the zip suffix (cuda13.3) and
# the host env var (CUDA_PATH_V13_3) never change across 13.x patch levels.
# Why 13.3 and not 13.4: the 13.4 Windows installer does NOT put the cuBLAS
# runtime DLL in bin\ (it moved to a separate sub-package), which broke both
# the build gate and scripts\build-whisper-cuda.cmd's cublas64_13.dll check.
# 13.3 keeps the runtime DLL in bin\ (like 12.9), so the whole path is
# unblocked with the same route the working lane already uses.
#
# State: `upstream-sha` (repo root) = last PUBLISHED upstream version (as a SHA).
# The commit-sha job self-commits it back -- the llama-slim keepalive pattern.
# Cadence: weekly (Tue 09:00 UTC) poll + manual workflow_dispatch. A poll only
# rebuilds when the upstream version changed; otherwise it exits fast (no build).

name: auto-rebuild-on-upstream

on:
  schedule:
    # Weekly, Tuesday 09:00 UTC: poll ggml-org/whisper.cpp master. Rebuild ONLY if
    # the upstream version number (CMakeLists WHISPER_VERSION) changed vs the last
    # published build; otherwise exits fast with no build.
    - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Explicit upstream commit to build (default: latest master)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if the upstream version is already published'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: auto-rebuild-whisper-cuda
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # check-upstream: config-independent. Resolves upstream head, decides whether to
  # rebuild, and computes the human-readable version label used for naming.
  check-upstream:
    runs-on: ubuntu-24.04
    outputs:
      build_sha: ${{ steps.check.outputs.build_sha }}
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      version_label: ${{ steps.version.outputs.version_label }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve latest upstream master SHA
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # ggml-org/whisper.cpp is a public repo: an unauthenticated curl needs
          # no token at all -- so no auth header to get wrong. Retries a few
          # times in case of a transient rate-limit / outage.
          url="https://api.github.com/repos/ggml-org/whisper.cpp/commits/master"
          sha=""
          for i in 1 2 3; do
            sha=$(curl -fsSL --max-time 60 -H "User-Agent: hermes-carpet/ci-rebuild-check" \
                    "$url" 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
            [ -n "$sha" ] && break
            echo "attempt $i: unresolved (empty or API error); retrying in 15s"
            sleep 15
          done
          if [ -z "$sha" ]; then
            echo "ERROR: could not resolve upstream master SHA from $url"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream master: $sha"

      - name: Resolve upstream version (SemVer number + release label) for this master
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # whisper.cpp keeps its SemVer in CMakeLists.txt (WHISPER_VERSION_MAJOR
          # / MINOR / PATCH). `version` is the bare number (the TRIGGER key);
          # `version_label` is the human-readable name used for tag/title/assets:
          #   "<X.Y.Z>"     when master HEAD is exactly the upstream vX.Y.Z tag
          #   "<X.Y.Z>-dev" when master is a post-tag development commit
          #   "<sha12>"     fallback if the version cannot be resolved
          latest="${{ steps.latest.outputs.sha }}"
          explicit="${{ inputs.upstream_sha }}"
          [ -n "$explicit" ] && latest="$explicit"
          sha="$latest"
          v=""
          if [ -n "$sha" ]; then
            # raw.githubusercontent.com is PUBLIC -- no token needed.
            cm=$(curl -fsSL \
                  "https://raw.githubusercontent.com/ggml-org/whisper.cpp/${sha}/CMakeLists.txt" || echo "")
            maj=$(printf '%s\n' "$cm" | sed -nE 's/^set\(WHISPER_VERSION_MAJOR ([0-9]+).*/\1/p' | head -1)
            min=$(printf '%s\n' "$cm" | sed -nE 's/^set\(WHISPER_VERSION_MINOR ([0-9]+).*/\1/p' | head -1)
            pat=$(printf '%s\n' "$cm" | sed -nE 's/^set\(WHISPER_VERSION_PATCH ([0-9]+).*/\1/p' | head -1)
            if [ -n "${maj}${min}${pat}" ]; then v="${maj}.${min}.${pat}"; fi
          fi

          label=""
          if [ -n "$v" ]; then
            # Does this sha match an upstream git tag (v<version>)? A tag may be
            # annotated (needs deref) or lightweight (points straight at commit).
            commit_of_tag=""
            vref=$(gh api "repos/ggml-org/whisper.cpp/git/refs/tags/v${v}" 2>/dev/null || echo "")
            if [ -n "${vref}" ]; then
              obj_type=$(printf '%s' "${vref}" | jq -r '.object.type' 2>/dev/null || echo "")
              obj_sha=$(printf '%s' "${vref}" | jq -r '.object.sha' 2>/dev/null || echo "")
              if [ "${obj_type}" = "tag" ]; then
                commit_of_tag=$(gh api "repos/ggml-org/whisper.cpp/git/tags/${obj_sha}" --jq '.object.sha' 2>/dev/null || echo "")
              else
                commit_of_tag="${obj_sha}"
              fi
            fi
            if [ -n "${sha}" ] && [ "${commit_of_tag:-}" = "${sha}" ]; then label="${v}"; else label="${v}-dev"; fi
          fi
          if [ -z "$label" ]; then
            label="${sha:0:12}"
            echo "WARN: upstream version unresolved; using bare sha for naming"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "version_label=${label}" >> "$GITHUB_OUTPUT"
          echo "build_sha_out=${sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=${v:-<none>} label=${label} sha=${sha:0:12}"

      - name: Compare upstream VERSION with last published (number-only gate)
        id: check
        run: |
          set -euo pipefail
          candidate="${{ steps.version.outputs.version }}"
          force="${{ inputs.force }}"
          # upstream-sha = last PUBLISHED build's master head (a SHA). Map it to a
          # version number the same way `version` does, so the gate compares
          # version-to-version. If the state file is missing/empty (first run) or
          # its SHA's version can't be resolved, treat as "no prior version" and
          # build.
          published_sha=$(cat upstream-sha 2>/dev/null || echo "")
          published_version=""
          if [ -n "$published_sha" ]; then
            pcm=$(curl -fsSL \
                  "https://raw.githubusercontent.com/ggml-org/whisper.cpp/${published_sha}/CMakeLists.txt" || echo "")
            pmaj=$(printf '%s\n' "$pcm" | sed -nE 's/^set\(WHISPER_VERSION_MAJOR ([0-9]+).*/\1/p' | head -1)
            pmin=$(printf '%s\n' "$pcm" | sed -nE 's/^set\(WHISPER_VERSION_MINOR ([0-9]+).*/\1/p' | head -1)
            ppat=$(printf '%s\n' "$pcm" | sed -nE 's/^set\(WHISPER_VERSION_PATCH ([0-9]+).*/\1/p' | head -1)
            [ -n "${pmaj}${pmin}${ppat}" ] && published_version="${pmaj}.${pmin}.${ppat}"
          fi
          echo "published_sha=${published_sha:-<none>} (version ${published_version:-<unresolved>})"
          echo "candidate_version=${candidate:-<unresolved>}"
          if [ -n "$candidate" ] && [ "$candidate" = "$published_version" ] && [ "$force" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "build_sha=" >> "$GITHUB_OUTPUT"
            echo "Upstream version unchanged (${candidate}); nothing to rebuild."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "build_sha=${{ steps.version.outputs.build_sha_out }}" >> "$GITHUB_OUTPUT"
            echo "Version change: ${published_version:-<none>} -> ${candidate:-<unresolved>}; building."
          fi

  # build-cpu: CPU-only build of the same commit + real jfk.wav transcription.
  # Runs ONCE (config-independent) -- the executable smoke test proving the sources
  # + toolchain are coherent before we trust the CUDA builds.
  build-cpu:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      UPSTREAM_SHA: ${{ needs.check-upstream.outputs.build_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch upstream whisper.cpp at candidate SHA (ggml vendored, no submodules)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path upstream | Out-Null
          Push-Location upstream
          git init -q
          git remote add origin https://github.com/ggml-org/whisper.cpp
          git fetch -q --depth 1 origin $env:UPSTREAM_SHA
          git checkout -q FETCH_HEAD
          Write-Host "checked out $(git rev-parse HEAD)"
          Pop-Location

      - name: Build CPU whisper-cli (no CUDA)
        shell: cmd
        run: |
          scripts\build-whisper-cuda.cmd CPU > build-cpu.log 2>&1
          if errorlevel 1 (
            echo "=== CPU build FAILED: last 60 lines of build-cpu.log ==="
            powershell -NoProfile -Command "Get-Content build-cpu.log -Tail 60"
            exit /b 1
          )
          powershell -NoProfile -Command "Get-Content build-cpu.log -Tail 20"

      - name: CPU smoke test (transcribe jfk.wav with the CPU build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = "$PWD\build-cpu\bin\whisper-cli.exe"
          if (-not (Test-Path $exe)) { throw "CPU whisper-cli.exe missing at $exe" }
          $wav = "$PWD\upstream\samples\jfk.wav"
          if (-not (Test-Path $wav)) { throw "jfk.wav not found at $wav" }
          New-Item -ItemType Directory -Force -Path model | Out-Null
          $model = "$PWD\model\ggml-tiny.en.bin"
          if (-not (Test-Path $model)) {
            Write-Host "Downloading ggml-tiny.en.bin..."
            Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" -OutFile $model -UseBasicParsing
          }
          Write-Host ("model size: {0:N0} bytes" -f (Get-Item $model).Length)
          Write-Host "Running: $exe -m $model -f $wav -l en -nt"
          & $exe -m $model -f $wav -l en -nt > transcribe.log 2>&1
          $code = $LASTEXITCODE
          Write-Host "---- transcribe.log ----"
          Get-Content transcribe.log
          if ($code -ne 0) { throw "whisper-cli exited $code on CPU smoke test (see transcribe.log)" }
          $txt = Get-Content transcribe.log -Raw
          if ($txt -notmatch 'that is|country|american|fellow|ask not|your|that no') {
            Write-Host "WARN: transcript did not match expected JFK keywords: $txt"
          }
          "CPU smoke test PASSED" | Out-File -FilePath cpu-pass.txt -Encoding ascii
          Write-Host "CPU smoke test PASSED"

      - name: Upload CPU pass marker + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-pass
          path: |
            cpu-pass.txt
            build-cpu.log
            transcribe.log
          retention-days: 14
          if-no-files-found: warn

  # build-windows (matrix): one leg per GPU/CUDA config. Each leg installs its build
  # CUDA toolkit, builds the single-arch CUDA whisper-cli, structurally verifies it,
  # and packages its two zips (slim + cublas-bundled) named per config.
  build-windows:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    # windows-2022 is PINNED: windows-latest rotated to the VS 2026-only
    # "windows-2025-vs2026" image (no VS 2022) on 2026-09-25. CUDA 12.x and 13.x
    # both support VS 2022 (13.0 only dropped VS 2017; 13.2 added VS 2026 as an
    # extra), so both configs build here. A config can override runs-on + VS_HINT
    # if a future CUDA ever drops VS 2022.
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # RTX 2060/2070/2080 / Titan Xp : Turing sm_75, CUDA 12.9.
          # Jimver/cuda-toolkit resolves 12.9.0 cleanly via its CDN list.
          - cfg: turing-cuda12.9
            install_method: jimver
            arch: 75
            build_cuda: '12.9.0'       # CUDA toolkit version CI installs
            dll_major: '12'            # cublas64_12.dll / cudart64_12.dll
            host_cuda: '12.9'          # zip suffix + host env major.minor
            host_env_var: 'CUDA_PATH_V12_9'
            gpu: 'RTX 2060 / 2070 / 2080 / Titan Xp (Turing sm_75)'
            arch_short: 'Turing sm_75'
          # RTX 4060 : Ada sm_89, host CUDA 13.3.
          # Install: Jimver/cuda-toolkit (method: network), the SAME source-and-route
          # as the 12.9 lane. Jimver resolves the 13.3.x patch from its own CDN map,
          # so a stale hardcoded NVIDIA URL can never break the run, and no winget
          # Appx bootstrap / manual download is needed. 13.3 is used (not 13.4)
          # because the 13.4 Windows installer moved the cuBLAS runtime out of bin\
          # into a sub-package, which broke the cuBLAS-in-bin\ gate here.
          - cfg: ada-cuda13.3
            install_method: jimver
            arch: 89
            build_cuda: '13.3.1'     # CUDA toolkit version CI installs (13.3 line, newest patch in Jimver's map)
            dll_major: '13'          # cublas64_13.dll / cudart64_13.dll
            host_cuda: '13.3'
            host_env_var: 'CUDA_PATH_V13_3'
            gpu: 'RTX 4060 (Ada sm_89)'
            arch_short: 'Ada sm_89'
    env:
      CFG: ${{ matrix.cfg }}
      UPSTREAM_SHA: ${{ needs.check-upstream.outputs.build_sha }}
      UPSTREAM_VERSION_LABEL: ${{ needs.check-upstream.outputs.version_label }}
      CUDA_ARCH: ${{ matrix.arch }}
      CUDA_MAJOR: ${{ matrix.dll_major }}
      CUDA_BUILD_VER: ${{ matrix.build_cuda }}
      HOST_CUDA: ${{ matrix.host_cuda }}
      HOST_ENV: ${{ matrix.host_env_var }}
      HOST_GPU: ${{ matrix.gpu }}
      HOST_ARCH_SHORT: ${{ matrix.arch_short }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch upstream whisper.cpp at candidate SHA (ggml vendored, no submodules)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path upstream | Out-Null
          Push-Location upstream
          git init -q
          git remote add origin https://github.com/ggml-org/whisper.cpp
          git fetch -q --depth 1 origin $env:UPSTREAM_SHA
          git checkout -q FETCH_HEAD
          Write-Host "checked out $(git rev-parse HEAD)"
          Pop-Location

      # Install CUDA.
      #   Both lanes now use Jimver/cuda-toolkit (method: network):
      #     - 2060 / CUDA 12.9  -> Jimver resolves 12.9.0 (proven green)
      #     - 4060 / CUDA 13.3  -> Jimver resolves 13.3.1 from its own CDN map
      #   No winget Appx bootstrap, no manual installer download, no hardcoded
      #   NVIDIA URL -- every install is manifest/CDN-driven through the action.
      - name: Install CUDA ${{ matrix.build_cuda }} via Jimver (config ${{ matrix.cfg }})
        if: matrix.install_method == 'jimver'
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-jimver
        with:
          cuda: ${{ matrix.build_cuda }}
          method: 'network'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Build CUDA whisper-cli (${{ matrix.arch_short }})
        shell: cmd
        run: |
          scripts\build-whisper-cuda.cmd CUDA > build-cuda.log 2>&1
          if errorlevel 1 (
            echo "=== CUDA build FAILED: last 60 lines of build-cuda.log ==="
            powershell -NoProfile -Command "Get-Content build-cuda.log -Tail 60"
            exit /b 1
          )
          echo "=== CUDA build OK: last 30 lines of build-cuda.log ==="
          powershell -NoProfile -Command "Get-Content build-cuda.log -Tail 30"

      - name: Verify CUDA build (structural - no GPU on this runner)
        shell: pwsh
        run: |
          $env:PATH = "$env:CUDA_PATH\bin;" + $env:PATH
          . "$PWD\scripts\verify-cuda.ps1"

      - name: 'Package slim (system cuBLAS) + portable (bundled cuBLAS) [$HOST_CUDA]'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $label   = $env:UPSTREAM_VERSION_LABEL
          if (-not $label) { $label = ($env:UPSTREAM_SHA).Substring(0,12) }
          $cu      = $env:HOST_CUDA    # e.g. 12.9 / 13.3 -> zip suffix + launcher
          $envVar  = $env:HOST_ENV     # e.g. CUDA_PATH_V12_9 / CUDA_PATH_V13_3
          $example = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v' + $cu

          New-Item -ItemType Directory -Force -Path dist\slim | Out-Null
          Copy-Item "$PWD\build\bin\whisper-cli.exe" dist\slim\
          # With --target whisper-cli the DLL set is exactly { whisper-cli.exe
          # whisper.dll ggml.dll ggml-base.dll ggml-cpu.dll ggml-cuda.dll }.
          Get-ChildItem "$PWD\build\bin" -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName dist\slim\ }
          Write-Host "Slim payload (config $env:CFG, host CUDA $cu):"
          Get-ChildItem dist\slim | ForEach-Object { Write-Host ("  {0,12:N0}  {1}" -f $_.Length, $_.Name) }

          # Build the launcher as an array of SINGLE-quoted strings (no PowerShell
          # expansion, no double-quote-escaping) with placeholders, then substitute.
          $launcher = @(
            '@echo off'
            'rem whisper-cuda launcher (host CUDA __CU__): prefer __ENVVAR__ (toolkit-set)'
            'rem so cuBLAS/cuDART resolve from the CUDA __CU__ install, not a polluted PATH.'
            'if "%__ENVVAR__%"=="" ('
            '  echo [whisper-cuda] WARNING: __ENVVAR__ is not set on this machine.'
            '  echo [whisper-cuda]   cuBLAS/cuDART must come from the CUDA __CU__ toolkit.'
            '  echo [whisper-cuda]   Fix: set __ENVVAR__ to your CUDA __CU__ install dir,'
            '  echo [whisper-cuda]   e.g. __EXAMPLE__ (the CUDA __CU__ toolkit normally sets this) and re-run.'
            ') else ('
            '  rem 12.x runtime in %__ENVVAR__%\bin, 13.x in %__ENVVAR__%\bin\x64 -- add both'
            '  set "PATH=%__ENVVAR__%\bin;%__ENVVAR__%\bin\x64;%PATH%"'
            ')'
            '"%~dp0whisper-cli.exe" %*'
          )
          $bat = ($launcher -join "`r`n").Replace('__CU__',$cu).Replace('__ENVVAR__',$envVar).Replace('__EXAMPLE__',$example) + "`r`n"
          [IO.File]::WriteAllText("$PWD\dist\slim\whisper.bat", $bat, [Text.Encoding]::ASCII)

          # Slim zip: exe + ggml/whisper DLLs + launcher. cuBLAS from system CUDA $cu.
          Compress-Archive -Path dist\slim\* -DestinationPath "whisper-cli-$label-win-cuda$cu.zip" -Force
          # Portable zip: same, but bundle cuBLAS (cublas*.dll) from the toolkit bin.
          # CUDA 12.x puts the cuBLAS runtime DLLs in bin\; CUDA 13.x NVIDIA moves
          # them to bin\x64. Gather from BOTH so the -cublas package is complete
          # whatever the host's layout is.
          New-Item -ItemType Directory -Force -Path dist\full | Out-Null
          Copy-Item dist\slim\* dist\full\ -Force
          $cubFrom = @()
          foreach ($dir in @("$env:CUDA_PATH\bin", "$env:CUDA_PATH\bin\x64")) {
            if (Test-Path $dir) { $cubFrom += @(Get-ChildItem $dir -Filter 'cublas*.dll' -ErrorAction SilentlyContinue) }
          }
          $cubFrom = @($cubFrom | Sort-Object FullName -Unique)
          if (-not $cubFrom.Count) { throw "no cublas*.dll in $env:CUDA_PATH\bin or \bin\x64 - cannot build the portable -cublas package" }
          $cubFrom | ForEach-Object { Write-Host ("  bundle cuBLAS: {0}" -f $_.Name) }
          $cubFrom | ForEach-Object { Copy-Item $_.FullName dist\full\ -Force }
          Compress-Archive -Path dist\full\* -DestinationPath "whisper-cli-$label-win-cuda$cu-cublas.zip" -Force

          Write-Host "=== release zips (config $env:CFG, label=$label, cuda$cu) ==="
          Get-ChildItem "$PWD" -Filter 'whisper-cli-*.zip' | ForEach-Object {
            Write-Host ("  {0,10:N0} KB  {1}" -f ($_.Length/1024), $_.Name)
          }

      - name: 'Upload zips for release (config ${{ matrix.cfg }})'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.cfg }}
          path: |
            whisper-cli-*.zip
          retention-days: 14
          if-no-files-found: warn

      - name: 'Upload build logs (config ${{ matrix.cfg }})'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.cfg }}
          path: |
            build-cuda.log
            sass-targets.txt
          retention-days: 14
          if-no-files-found: warn

  # release: wait for the CPU smoke test + ALL matrix legs to pass, then publish ONE
  # release (tag whisper-<label>) containing every config's two zips.
  release:
    needs: [check-upstream, build-cpu, build-windows]
    if: always() && needs.build-cpu.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: 'pkg-*'
          path: artifacts

      - name: Create GitHub Release (only on full pass)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ needs.check-upstream.outputs.build_sha }}
          VERSION_LABEL: ${{ needs.check-upstream.outputs.version_label }}
        run: |
          set -euo pipefail
          sha="${{ needs.check-upstream.outputs.build_sha }}"
          label="${VERSION_LABEL}"
          [ -n "${label}" ] || label="${sha:0:12}"

          # Gather every config's zips. download-artifact with `pattern` nests
          # each cfg under artifacts/pkg-<cfg>/, so find them recursively.
          mapfile -t zips < <(find artifacts -name 'whisper-cli-*.zip' 2>/dev/null | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "ERROR: no whisper-cli-*.zip files found in the release artifact."
            exit 1
          fi

          tag="whisper-${label}"
          # idempotent: replace a prior (force) run that already created this tag.
          # Do NOT use a bare `|| true`: if DELETE fails transiently (rate limit /
          # API flake) the tag survives and the POST below 422s with
          # "tag_name already_exists". Retry DELETE until the tag is verifiably
          # gone (GET 404s), with a bound so a real error still fails the step.
          for attempt in 1 2 3 4 5; do
            # A missing tag/release means the GET 404s -- that's the success condition.
            if gh api -q . "repos/${{ github.repository }}/releases/tags/${tag}" >/dev/null 2>&1; then
              # release exists -- delete it
              gh api -X DELETE "repos/${{ github.repository }}/releases/tags/${tag}" >/dev/null 2>&1 || true
            fi
            # verify it's really gone
            if ! gh api -q . "repos/${{ github.repository }}/releases/tags/${tag}" >/dev/null 2>&1; then
              echo "tag ${tag} is free (delete verified on attempt ${attempt})"
              break
            fi
            echo "tag ${tag} still present after attempt ${attempt}; retrying in 15s"
            [ "${attempt}" -ge 5 ] && { echo "ERROR: could not clear existing tag ${tag} for release"; exit 1; }
            sleep 15
          done

          # --- Build the release body ----------------------------------------
          TOP_LINE="whisper-cli \`${label}\` from \`ggml-org/whisper.cpp\` -- Windows 10 GPU builds."
          SHA_LINE="Upstream commit: \`${sha}\`."
          FILES_SECTION=""
          for z in "${zips[@]}"; do FILES_SECTION="${FILES_SECTION}  - \`$(basename "$z")\`"$'\n'; done

          {
            printf '%s\n' "$TOP_LINE"
            printf '\n'
            printf '%s\n' "$SHA_LINE"
            printf '\n'
            printf '## Packages (per GPU/CUDA config)\n\n'
            printf 'Each config ships two zips:\n'
            printf '  - **slim** (no `-cublas`): relies on your system CUDA toolkit. `whisper.bat`\n'
            printf '    puts the toolkit bin first on PATH (via the config host env var, e.g.\n'
            printf '    `%%CUDA_PATH_V12_9%%` / `%%CUDA_PATH_V13_3%%`) so cuBLAS loads from that install.\n'
            printf '    If the env var is unset it prints exactly what to set and exits.\n'
            printf '  - **cublas** (`-cublas` suffix): bundles `cublas*.dll` for machines without CUDA.\n'
            printf '\n'
            printf '### Files in this release\n\n'
            printf '%s\n' "$FILES_SECTION"
            cat <<'BODY'
          ## Windows host requirements
          - An NVIDIA GPU + a relatively recent GPU driver (provides `nvcuda.dll`).
          - For the **slim** package: a CUDA toolkit matching the package (12.9 for the
            Turing build, 13.x for the Ada build). The launcher resolves it through the
            toolkit-set `CUDA_PATH_V<MAJ>_<MIN>` variable.

          ## Configs in this build
          ### turing-cuda12.9 -- RTX 2060 / 2070 / 2080 / Titan Xp (Turing sm_75)
          - CUDA 12.9 (Jimver/cuda-toolkit), `-DCMAKE_CUDA_ARCHITECTURES=75`.
          - Host launcher uses `CUDA_PATH_V12_9`.
          ### ada-cuda13.3 -- RTX 4060 (Ada sm_89)
          - Built against CUDA 13.3 (installed on the runner via Jimver/cuda-toolkit,
            method: network -- the same route-and-source as the 12.9 lane);
            runs on the 4060's own CUDA 13.x host.
          - `-DCMAKE_CUDA_ARCHITECTURES=89`; host launcher uses `CUDA_PATH_V13_3`.

          ## Common build notes (all configs)
          - `GGML_STATIC=ON` => cudart statically linked (no `cudart64_*.dll` needed) -- verified in CI.
          - cuBLAS stays a DLL -- NVIDIA ships no static `cublas.lib` for Windows, so the
            CUDA DLL links static cudart + dynamic cuBLAS.
          - Kernels are nvcc-compiled to a SINGLE-arch SASS at build time (no NVRTC / no
            runtime JIT): instant cold start, and a much smaller `ggml-cuda.dll`.
          - Tests, server, SDL2, cURL, OpenMP and native-CPU autotuning are off; only
            `whisper-cli` is compiled (`--target`). The CPU backend is a single baseline
            variant (GGML_NATIVE=OFF).

          ## Files (per package)
          - `whisper-cli.exe` -- the CLI
          - `ggml-cuda.dll` -- single-arch (see config above)
          - `ggml.dll`, `ggml-base.dll`, `ggml-cpu.dll`, `whisper.dll`
          - `whisper.bat` -- launcher that resolves the correct CUDA via `CUDA_PATH_V<MAJ>_<MIN>`

          ## CI verification (GPU-less runner)
          The CUDA binary cannot be *executed* on a hosted runner (it imports `nvcuda.dll`,
          the driver, which runners do not have -- would die with 0xC0000135 at load). Instead CI:
          1. builds a CPU-only binary of the same commit and runs a real transcription of
             `samples/jfk.wav` (tiny.en) -- must exit 0 and contain the expected JFK keywords;
          2. for EVERY config, structurally verifies the CUDA artifacts: no `cudart64_<major>.dll`
             import (cudart static), `cublas64_<major>.dll` + `nvcuda` imports present,
             `ggml-cuda.dll` single-arch sized, and the target `sm_<arch>` SASS embedded
             (verified via cuobjdump).

          ## Usage
          ```bat
          whisper.bat -m yourmodel.bin -f audio.wav -l en
          ```
          BODY
          } > release-body.md

          # Create the release via REST (no local git / tag-pushing). target_commitish
          # is omitted on purpose: build_sha is the upstream whisper.cpp commit, which
          # does not exist in THIS repo. Default = default branch HEAD.
          gh api -X POST "repos/${{ github.repository }}/releases" \
            -f "tag_name=${tag}" \
            -f "name=whisper-cli ${label}" \
            -F "body=@release-body.md" \
            --jq '.id'

          # Upload every config's zips to the single release. zips[] holds full
          # nested paths (artifacts/pkg-<cfg>/whisper-cli-*.zip) -- pass them as
          # an explicit array; a flat glob would not match the artifact subfolders.
          gh release upload "${tag}" "${zips[@]}" --clobber

  # commit-sha: self-commit the newly published upstream SHA (keepalive push).
  commit-sha:
    needs: [check-upstream, release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Commit + push new published SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ needs.check-upstream.outputs.build_sha }}"
          if [ "$(cat upstream-sha 2>/dev/null)" = "$sha" ]; then
            echo "upstream-sha already $sha -- force-rebuild; nothing to self-commit."
            exit 0
          fi
          echo "${sha}" > upstream-sha
          git config user.name  "hermes-carpet"
          git config user.email "hermes-carpet@users.noreply.github.com"
          git add upstream-sha
          git commit -m "auto-rebuild: publish whisper-cuda build for upstream ${sha}"
          git push
          echo "pushed new upstream-sha: ${sha}"
